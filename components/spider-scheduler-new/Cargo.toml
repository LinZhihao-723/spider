[package]
name = "spider-scheduler-new"
version = { workspace = true }
edition = { workspace = true }

[lib]
name = "spider_scheduler_new"
path = "src/lib.rs"

[[bin]]
name = "bench-scheduler"
path = "src/bin/bench_scheduler.rs"

[[bin]]
name = "bench-workers"
path = "src/bin/bench_workers.rs"

[dependencies]
async-channel = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slotmap = { workspace = true }
spider-core = { workspace = true }
thiserror = { workspace = true }
tokio = {
  workspace = true,
  features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"]
}
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
